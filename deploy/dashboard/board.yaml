# yaml-language-server: $schema=https://public-assets.zegreatrob.com/dashboard/0.27.1/board-config.schema.json

sources:
  coupling:
    type: github-actions
    repo: robertfmurdock/coupling
    branch: master
    github_app:
      app_id_env: GITHUB_APP_ID
      private_key_env: GITHUB_APP_PRIVATE_KEY
      installation_id_env: GITHUB_APP_INSTALLATION_ID
  jsmints:
    type: github-actions
    repo: robertfmurdock/jsmints
    branch: master
    github_app:
      app_id_env: GITHUB_APP_ID
      private_key_env: GITHUB_APP_PRIVATE_KEY
      installation_id_env: GITHUB_APP_INSTALLATION_ID
  testmints:
    type: github-actions
    repo: robertfmurdock/testmints
    branch: master
    github_app:
      app_id_env: GITHUB_APP_ID
      private_key_env: GITHUB_APP_PRIVATE_KEY
      installation_id_env: GITHUB_APP_INSTALLATION_ID
  ze-great-tools:
    type: github-actions
    repo: robertfmurdock/ze-great-tools
    branch: main
    github_app:
      app_id_env: GITHUB_APP_ID
      private_key_env: GITHUB_APP_PRIVATE_KEY
      installation_id_env: GITHUB_APP_INSTALLATION_ID
  ze-great-dashboard:
    type: github-actions
    repo: robertfmurdock/ze-great-dashboard
    branch: main
    github_app:
      app_id_env: GITHUB_APP_ID
      private_key_env: GITHUB_APP_PRIVATE_KEY
      installation_id_env: GITHUB_APP_INSTALLATION_ID

boards:
  ze-great-team:
    refresh: 60s
    panels:
      - id: coupling-build
        type: pipeline-status
        source: coupling
        pipeline: main.yml
        position: { x: 0, y: 0, w: 3, h: 4 }
      - id: coupling-automatic-updates
        type: pull-request-health
        label: Coupling Updates
        source: coupling
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - create-pull-request/
        position: { x: 3, y: 0, w: 1, h: 4 }
        density: compact
      - id: jsmints-build
        type: pipeline-status
        source: jsmints
        pipeline: main.yml
        position: { x: 4, y: 0, w: 3, h: 4 }
      - id: jsmints-automatic-updates
        type: pull-request-health
        label: JS Mints Updates
        source: jsmints
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - cpr/
        position: { x: 7, y: 0, w: 1, h: 4 }
        density: compact
      - id: testmints-build
        type: pipeline-status
        source: testmints
        pipeline: main.yml
        position: { x: 8, y: 0, w: 3, h: 4 }
      - id: testmints-automatic-updates
        type: pull-request-health
        label: Test Mints Updates
        source: testmints
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - create-pull-request/
        position: { x: 11, y: 0, w: 1, h: 4 }
        density: compact
      - id: ze-great-dashboard-build
        type: pipeline-status
        source: ze-great-dashboard
        pipeline: main.yml
        position: { x: 0, y: 4, w: 5, h: 4 }
      - id: ze-great-dashboard-automatic-updates
        type: pull-request-health
        label: Ze Great Dashboard Updates
        source: ze-great-dashboard
        base_branch: main
        build_workflow: main.yml
        update_workflows:
          - workflow: dependency-update.yml
            branch_prefixes:
              - automation/npm-dependencies-
        position: { x: 5, y: 4, w: 1, h: 4 }
        density: compact
      - id: ze-great-tools-build
        type: pipeline-status
        source: ze-great-tools
        pipeline: main.yml
        position: { x: 6, y: 4, w: 5, h: 4 }
      - id: ze-great-tools-automatic-updates
        type: pull-request-health
        label: Ze Great Tools Updates
        source: ze-great-tools
        base_branch: main
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - create-pull-request/
        position: { x: 11, y: 4, w: 1, h: 4 }
        density: compact
      - id: latest-releases
        type: http-value
        label: Latest releases
        refresh: 15m
        density: compact
        position: { x: 0, y: 8, w: 6, h: 2 }
        facts:
          - id: tagger-latest-version
            label: Tagger
            url: https://registry.npmjs.org/@continuous-excellence%2Ftagger/latest
            json_path: $.version
            link: https://www.npmjs.com/package/@continuous-excellence/tagger
          - id: coupling-latest-version
            label: Coupling CLI
            url: https://registry.npmjs.org/@continuous-excellence%2Fcoupling-cli/latest
            json_path: $.version
            link: https://www.npmjs.com/package/@continuous-excellence/coupling-cli
          - id: jsmints-latest-version
            label: JS Mints
            url: https://api.github.com/repos/robertfmurdock/jsmints/releases/latest
            json_path: $.tag_name
            link: https://github.com/robertfmurdock/jsmints/releases/latest
          - id: testmints-latest-version
            label: Test Mints
            url: https://api.github.com/repos/robertfmurdock/testmints/releases/latest
            json_path: $.tag_name
            link: https://github.com/robertfmurdock/testmints/releases/latest
