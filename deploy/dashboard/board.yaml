# yaml-language-server: $schema=https://public-assets.zegreatrob.com/dashboard/0.18.0/board-config.schema.json

sources:
  coupling:
    type: github-actions
    repo: robertfmurdock/coupling
    branch: master
    token_env: GITHUB_TOKEN
  jsmints:
    type: github-actions
    repo: robertfmurdock/jsmints
    branch: master
    token_env: GITHUB_TOKEN
  testmints:
    type: github-actions
    repo: robertfmurdock/testmints
    branch: master
    token_env: GITHUB_TOKEN
  ze-great-tools:
    type: github-actions
    repo: robertfmurdock/ze-great-tools
    branch: main
    token_env: GITHUB_TOKEN
  ze-great-dashboard:
    type: github-actions
    repo: robertfmurdock/ze-great-dashboard
    branch: main
    token_env: GITHUB_TOKEN

boards:
  ze-great-team:
    refresh: 60s
    panels:
      - id: coupling-build
        type: pipeline-status
        source: coupling
        pipeline: main.yml
        position: { x: 0, y: 0, w: 3, h: 4 }
      - id: coupling-automatic-updates
        type: pull-request-health
        label: Coupling Updates
        source: coupling
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - create-pull-request/
        position: { x: 3, y: 0, w: 1, h: 4 }
        density: compact
      - id: jsmints-build
        type: pipeline-status
        source: jsmints
        pipeline: main.yml
        position: { x: 4, y: 0, w: 3, h: 4 }
      - id: jsmints-automatic-updates
        type: pull-request-health
        label: JS Mints Updates
        source: jsmints
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - cpr/
        position: { x: 7, y: 0, w: 1, h: 4 }
        density: compact
      - id: testmints-build
        type: pipeline-status
        source: testmints
        pipeline: main.yml
        position: { x: 8, y: 0, w: 3, h: 4 }
      - id: testmints-automatic-updates
        type: pull-request-health
        label: Test Mints Updates
        source: testmints
        base_branch: master
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - create-pull-request/
        position: { x: 11, y: 0, w: 1, h: 4 }
        density: compact
      - id: ze-great-tools-build
        type: pipeline-status
        source: ze-great-tools
        pipeline: main.yml
        position: { x: 0, y: 4, w: 5, h: 4 }
      - id: ze-great-tools-automatic-updates
        type: pull-request-health
        label: Ze Great Tools Updates
        source: ze-great-tools
        base_branch: main
        build_workflow: main.yml
        update_workflows:
          - workflow: main.yml
            branch_prefixes:
              - cpr-gradle-update/
              - create-pull-request/
        position: { x: 5, y: 4, w: 1, h: 4 }
        density: compact
      - id: ze-great-dashboard-build
        type: pipeline-status
        source: ze-great-dashboard
        pipeline: main.yml
        position: { x: 6, y: 4, w: 6, h: 4 }
      - id: tagger-latest-version
        type: http-value
        url: https://registry.npmjs.org/@continuous-excellence%2Ftagger/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/tagger
        refresh: 15m
        density: compact
        position: { x: 0, y: 8, w: 3, h: 2 }
      - id: coupling-latest-version
        type: http-value
        url: https://registry.npmjs.org/@continuous-excellence%2Fcoupling-cli/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/coupling-cli
        refresh: 15m
        density: compact
        position: { x: 3, y: 8, w: 3, h: 2 }
      - id: jsmints-latest-version
        type: http-value
        url: https://api.github.com/repos/robertfmurdock/jsmints/releases/latest
        json_path: $.tag_name
        link: https://github.com/robertfmurdock/jsmints/releases/latest
        refresh: 15m
        density: compact
        position: { x: 6, y: 8, w: 3, h: 2 }
      - id: testmints-latest-version
        type: http-value
        url: https://api.github.com/repos/robertfmurdock/testmints/releases/latest
        json_path: $.tag_name
        link: https://github.com/robertfmurdock/testmints/releases/latest
        refresh: 15m
        density: compact
        position: { x: 9, y: 8, w: 3, h: 2 }
