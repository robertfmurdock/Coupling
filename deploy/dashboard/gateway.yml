AWSTemplateFormatVersion: '2010-09-09'
Description: Public HTTP gateway for the private Ze Great Team dashboard Lambda

Parameters:
  DashboardFunctionName:
    Type: String

Resources:
  DashboardHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${DashboardFunctionName}-gateway'
      ProtocolType: HTTP
  DashboardIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref DashboardHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${DashboardFunctionName}/invocations'
      PayloadFormatVersion: '2.0'
  DashboardDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref DashboardHttpApi
      RouteKey: $default
      Target: !Join ['/', ['integrations', !Ref DashboardIntegration]]
  DashboardDefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref DashboardHttpApi
      StageName: $default
      AutoDeploy: true
  DashboardGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DashboardFunctionName
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub '${DashboardHttpApi.ExecutionArn}/*'

Outputs:
  ApiEndpoint:
    Value: !GetAtt DashboardHttpApi.ApiEndpoint
